# 生成アセット取り込みワークフロー
# Higgsfieldで生成した画像・音声(公開CDN URL)を episodes/<ep>/assets.json の
# 定義に従ってダウンロードし、このブランチにコミットする。
# (リモート開発環境のネットワークポリシーでCDNへ直接アクセスできないための迂回路)
name: fetch-assets
on:
  workflow_dispatch:
    inputs:
      episode:
        description: 'assets.json を含むエピソードディレクトリ (例: episodes/ep001)'
        required: true
        default: episodes/ep001
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        env:
          EP: ${{ github.event.inputs.episode }}
        run: |
          python3 - "$EP" <<'EOF'
          import json, sys, pathlib, urllib.request
          ep = pathlib.Path(sys.argv[1])
          for item in json.loads((ep / "assets.json").read_text()):
              dest = ep / item["path"]
              dest.parent.mkdir(parents=True, exist_ok=True)
              urllib.request.urlretrieve(item["url"], dest)
              print("downloaded:", dest)
          EOF
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fetch generated assets for ${{ github.event.inputs.episode }}" || echo "nothing to commit"
          git push
