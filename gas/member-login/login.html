<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      display: flex; justify-content: center;
      margin: 0; padding: 2em 1em; background: #f5f5f5;
    }
    .card {
      background: #fff; border-radius: 8px; padding: 2em;
      box-shadow: 0 1px 4px rgba(0,0,0,.15); width: 100%; max-width: 360px;
    }
    h3 { margin-top: 0; text-align: center; }
    input {
      display: block; width: 100%; box-sizing: border-box;
      padding: .6em; margin-bottom: .8em;
      border: 1px solid #ccc; border-radius: 4px; font-size: 1em;
    }
    button {
      width: 100%; padding: .7em; font-size: 1em; border: none;
      border-radius: 4px; background: #1a73e8; color: #fff; cursor: pointer;
    }
    button:disabled { background: #9bbcf0; cursor: wait; }
    .msg { min-height: 1.4em; font-size: .9em; text-align: center; margin: .8em 0 0; }
    .msg.error { color: #d93025; }
    .msg.info { color: #555; }
    #member-view button {
      background: #eee; color: #333; width: auto; padding: .4em 1.2em; margin-top: 1.5em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="login-view">
      <h3>会員ページ ログイン</h3>
      <input id="id" placeholder="ID" autocomplete="username">
      <input id="pw" type="password" placeholder="パスワード" autocomplete="current-password">
      <button id="btn" onclick="doLogin()">ログイン</button>
      <p id="msg" class="msg"></p>
    </div>
    <div id="member-view" style="display:none"></div>
  </div>

  <script>
    var token = null;
    try { token = sessionStorage.getItem('token'); } catch (e) { /* iframe内で使えない環境は無視 */ }

    // タブを開き直すまでの間はセッションを復元する
    window.addEventListener('load', function () {
      if (token) showMember();
    });

    document.getElementById('pw').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doLogin();
    });

    function doLogin() {
      var btn = document.getElementById('btn');
      btn.disabled = true;
      setMsg('確認中…', 'info');
      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          if (res && res.ok) {
            token = res.token;
            try { sessionStorage.setItem('token', token); } catch (e) {}
            showMember();
          } else {
            setMsg(res ? res.message : 'ログインに失敗しました', 'error');
          }
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          setMsg('エラー: ' + err.message, 'error');
        })
        .login(document.getElementById('id').value, document.getElementById('pw').value);
    }

    function showMember() {
      google.script.run
        .withSuccessHandler(function (html) {
          if (!html) { // トークン失効
            clearToken();
            setMsg('セッションが切れました。ログインし直してください', 'error');
            return;
          }
          document.getElementById('login-view').style.display = 'none';
          var view = document.getElementById('member-view');
          view.innerHTML = html;
          view.style.display = 'block';
        })
        .withFailureHandler(function (err) {
          setMsg('エラー: ' + err.message, 'error');
        })
        .getMemberContent(token);
    }

    // member.html内のログアウトボタンから呼ばれる
    function doLogout() {
      google.script.run.logout(token);
      clearToken();
      location.reload();
    }

    function clearToken() {
      token = null;
      try { sessionStorage.removeItem('token'); } catch (e) {}
    }

    function setMsg(text, type) {
      var el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + type;
    }
  </script>
</body>
</html>
