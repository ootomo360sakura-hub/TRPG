# アリアンロッド2E リプレイ漫画「鎖を断つ者たち」
# 囚われの冒険者たちがロイヤルの慰み者にされる日々から脱出し、
# 解放したNPCたちと共に新たな集落を興すまで。
title: 鎖を断つ者たち 〜アリアンロッド2E〜
font_size: 30

characters:
  leon:
    name: レオン(ウォーリア)
    look: 黒髪で頬に傷のある剣士。破れた白いシャツ
  sylpha:
    name: シルファ(メイジ)
    look: 銀髪ロングのエルフ魔術師。ボロボロのローブ
  pico:
    name: ピコ(シーフ)
    look: バンダナを巻いた小柄な盗賊の少年
  royal:
    name: ロイヤル
    look: 金髪縦ロールの退廃的な貴族。白と金のローブ
  npc:
    name: 解放された民
    look: 髭の老人・若い女性・子供たち

pages:
  # ---- 1ページ目: 導入(囚われの日々) ----
  - layout: intro_page
    panels:
      - image: panels/p1_1.png
        beat: 状況設定
        description: 城の地下闘技場。玉座のロイヤルが高笑いし、鎖に繋がれた冒険者3人が見世物にされている。
        dialogues:
          - speaker: royal
            text: もっと踊れ、冒険者ども!
            bx: 0.84
            by: 0.24
            max_chars: 7
            shape: shout
      - image: panels/p1_2.png
        beat: 苦境
        description: 地下牢。壁に鎖で繋がれ、拷問でボロボロの3人。うなだれている。
        dialogues:
          - speaker: sylpha
            text: もう…限界…
            bx: 0.74
            by: 0.26
            max_chars: 4
      - image: panels/p1_3.png
        beat: 決意
        description: 暗闇の中、レオンの鋭い眼のアップ。小声で仲間に告げる。
        dialogues:
          - speaker: leon
            text: 今夜、脱出する
            bx: 0.22
            by: 0.74
            max_chars: 4

  # ---- 2ページ目: 脱出劇 ----
  - layout: standard_6
    panels:
      - image: panels/p2_1.png
        beat: 起点
        description: ピコがヘアピンで枷の錠前を外す手元のアップ。
        dialogues:
          - speaker: pico
            text: 鍵は借りたよ
            bx: 0.76
            by: 0.26
            max_chars: 4
      - image: panels/p2_2.png
        beat: 解放
        description: 牢の扉が開き、レオンが囚われていたNPCの民たちに手を差し伸べる。
        dialogues:
          - speaker: leon
            text: 全員で行くぞ
            bx: 0.78
            by: 0.24
            max_chars: 4
          - speaker: npc
            text: 私たちも!?
            bx: 0.22
            by: 0.68
            max_chars: 4
      - image: panels/p2_3.png
        beat: 潜行
        description: 松明の廊下を身を低くして進む一行。曲がり角に衛兵の影。
        dialogues:
          - speaker: pico
            text: 静かに…
            bx: 0.78
            by: 0.26
            max_chars: 4
      - image: panels/p2_4.png
        beat: 突破
        description: シルファが魔法を放ち、城門を吹き飛ばす。閃光。
        dialogues:
          - speaker: sylpha
            text: 道は私が開く!
            bx: 0.24
            by: 0.26
            max_chars: 5
            shape: shout
      - image: panels/p2_5.png
        beat: 逃走
        description: 月明かりの中庭を、壊れた門へ向かって全員で駆け抜ける。流線。
        dialogues:
          - speaker: leon
            text: 走れーっ!
            bx: 0.76
            by: 0.24
            max_chars: 5
            shape: shout
      - image: panels/p2_6.png
        beat: 引き
        description: 玉座の間で杯を叩き落として激怒するロイヤル。
        dialogues:
          - speaker: royal
            text: ネズミどもがァ!
            bx: 0.30
            by: 0.28
            max_chars: 5
            shape: shout

  # ---- 3ページ目: 集落の誕生 ----
  - layout: climax_splash
    panels:
      - image: panels/p3_1.png
        beat: 夜明け
        description: 川辺の森の空き地で朝日を浴びて休む一行。安堵の表情。
        dialogues:
          - speaker: sylpha
            text: 自由の朝…
            bx: 0.75
            by: 0.28
            max_chars: 4
      - image: panels/p3_2.png
        beat: 宣言
        description: レオンが大地に杭を打ち込む。髭の老人が頷く。
        dialogues:
          - speaker: leon
            text: ここに村を興そう
            bx: 0.26
            by: 0.26
            max_chars: 5
      - image: panels/p3_3.png
        beat: 大団円
        description: 数カ月後の俯瞰。丸太の家・畑・柵のある集落。冒険者とNPCたちが共に働き、子供が駆け回る。朝の光。
        dialogues:
          - speaker: npc
            text: こうして、冒険者たちの集落が生まれた
            bx: 0.85
            by: 0.22
            max_chars: 9
            shape: narration
          - speaker: leon
            text: ただいまと言える場所だ
            bx: 0.14
            by: 0.72
            max_chars: 6
