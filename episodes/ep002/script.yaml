# アリアンロッド2E リプレイ漫画「鎖を断つ者たち」
# 囚われの冒険者たちがロイヤルの慰み者にされ、薬物実験を受ける日々から脱出し、
# 解放したNPCたちと共に新たな集落を興すまで。
title: 鎖を断つ者たち 〜アリアンロッド2E〜
font_size: 30

characters:
  leon:
    name: レオン(ウォーリア)
    look: 黒髪で頬に傷のある剣士。破れた白いシャツ
  sylpha:
    name: シルファ(メイジ)
    look: 銀髪ロングのエルフ魔術師。ボロボロのローブ
  pico:
    name: ピコ(シーフ)
    look: バンダナを巻いた小柄な盗賊の少年
  royal:
    name: ロイヤル
    look: 金髪縦ロールの退廃的な貴族。白と金のローブ
  alchemist:
    name: 錬金術師
    look: フードを被った不気味な宮廷錬金術師
  npc:
    name: 解放された民
    look: 髭の老人・若い女性・子供たち

pages:
  # ---- 1ページ目: 導入(囚われと実験の日々) ----
  - layout: intro_page
    panels:
      - image: panels/p1_1b.png
        beat: 状況設定
        description: 城の地下実験室。拘束された冒険者たちに宮廷錬金術師が薬物を投与し、ロイヤルが椅子から愉しげに見物している大ゴマ。
        dialogues:
          - speaker: royal
            text: 次の薬を試せ!
            bx: 0.84
            by: 0.24
            max_chars: 7
            shape: shout
      - image: panels/p1_2.png
        beat: 苦境
        description: 地下牢。壁に鎖で繋がれ、実験と拷問でボロボロの3人。うなだれている。
        dialogues:
          - speaker: sylpha
            text: もう…限界…
            bx: 0.74
            by: 0.26
            max_chars: 4
      - image: panels/p1_3.png
        beat: 誓い
        description: 暗闇の中、レオンの鋭い眼のアップ。
        dialogues:
          - speaker: leon
            text: 必ず…ここを出る
            bx: 0.22
            by: 0.74
            max_chars: 5

  # ---- 2ページ目: 薬物実験 ----
  - layout: standard_6
    panels:
      - image: panels/p2_1.png
        beat: 連行
        description: 衛兵に引き立てられ、実験室の鉄扉へ連行される3人。
        dialogues:
          - speaker: pico
            text: また あそこか…
            bx: 0.76
            by: 0.26
            max_chars: 4
      - image: panels/p2_2.png
        beat: 実験室
        description: 怪しげな錬金術実験室の全景。薬瓶・管・魔法陣。錬金術師が支度し、ロイヤルが椅子で見物。
        dialogues:
          - speaker: royal
            text: 今日の実験を始めよ
            bx: 0.24
            by: 0.26
            max_chars: 5
      - image: panels/p2_3.png
        beat: 拘束
        description: 実験台に革ベルトで拘束され、身をよじるレオン。
        dialogues:
          - speaker: leon
            text: くっ…!
            bx: 0.78
            by: 0.28
            max_chars: 4
      - image: panels/p2_4.png
        beat: 投与
        description: 錬金術師が光る薬液をシルファに投与する。苦悶の表情。
        dialogues:
          - speaker: sylpha
            text: や…めて…
            bx: 0.24
            by: 0.28
            max_chars: 4
      - image: panels/p2_5.png
        beat: 観察
        description: 檻の中で震えるピコを、ロイヤルが愉しげに記録しながら観察する。
        dialogues:
          - speaker: royal
            text: 実に興味深い
            bx: 0.76
            by: 0.26
            max_chars: 4
      - image: panels/p2_6.png
        beat: 決意
        description: 牢に投げ戻された3人。レオンだけが顔を上げ、眼に炎が宿る。
        dialogues:
          - speaker: leon
            text: 今夜、脱出する
            bx: 0.28
            by: 0.30
            max_chars: 4

  # ---- 3ページ目: 脱出と集落の誕生 ----
  - layout: climax_splash
    panels:
      - image: panels/p3_1.png
        beat: 突破
        description: シルファの魔法が城門を吹き飛ばし、解放したNPCの民たちと共に駆け出す一行。閃光。
        dialogues:
          - speaker: sylpha
            text: 道は私が開く!
            bx: 0.76
            by: 0.26
            max_chars: 5
            shape: shout
      - image: panels/p3_2.png
        beat: 逃走
        description: 月明かりの森へ、民たちを連れて逃げ込む3人。背後に遠ざかる城。
        dialogues:
          - speaker: leon
            text: 振り返るな、走れ!
            bx: 0.26
            by: 0.26
            max_chars: 5
            shape: shout
      - image: panels/p3_3.png
        beat: 大団円
        description: 数カ月後の俯瞰。川辺に丸太の家・畑・柵のある集落。冒険者とNPCたちが共に働き、子供が駆け回る。朝の光。
        dialogues:
          - speaker: npc
            text: こうして、冒険者たちの集落が生まれた
            bx: 0.85
            by: 0.22
            max_chars: 9
            shape: narration
          - speaker: leon
            text: ただいまと言える場所だ
            bx: 0.14
            by: 0.72
            max_chars: 6
