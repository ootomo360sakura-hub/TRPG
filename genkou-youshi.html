<title>原稿用紙（デジタル原稿用紙）</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e8ebef; font-family: "Noto Sans JP", "Meiryo", sans-serif; }
  .toolbar {
    position: sticky; top: 0; z-index: 20; background: #fff;
    border-bottom: 1px solid #ccd4dc; padding: 8px 14px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px;
  }
  .toolbar strong { color: #33506E; font-size: 15px; }
  .toolbar label { cursor: pointer; user-select: none; }
  .toolbar select {
    font-size: 13px; padding: 4px 6px; border: 1px solid #b8c4d0; border-radius: 6px;
    background: #fff; color: #223;
  }
  .toolbar .count { color: #33506E; font-weight: 700; margin-left: auto; }
  .toolbar button {
    background: #33506E; color: #fff; border: none; border-radius: 6px;
    padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  .toolbar button.sub { background: #eef2f6; color: #33506E; }
  #pages { padding: 10px 0 40px; }
  .page {
    position: relative; margin: 14px auto;
    background-color: #fff; background-size: 100% 100%;
    box-shadow: 0 2px 10px rgba(30,50,80,.25); cursor: text;
    container-type: size;
  }
  .page.land { width: min(1100px, 96vw); }
  .page.port { width: min(760px, 96vw); }
  .ch {
    position: absolute; transform: translate(-50%, -50%);
    line-height: 1; white-space: pre; color: #111; pointer-events: none;
    font-size: calc(var(--chf) * 1cqh);
    font-family: "UD デジタル 教科書体 N-R", "UD Digi Kyokasho N-R",
                 "Klee One", "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif;
  }
  /* 縦書き用 */
  .ch.pnc { transform: translate(-50%, -50%) translate(32%, -32%); }
  .ch.rot { transform: translate(-50%, -50%) rotate(90deg); }
  .ch.sml { transform: translate(-50%, -50%) translate(16%, -16%); }
  /* 横書き用 */
  .ch.pncH { transform: translate(-50%, -50%) translate(-32%, 32%); }
  .ch.smlH { transform: translate(-50%, -50%) translate(-16%, 16%); }
  .caret {
    position: absolute; transform: translate(-50%, -50%);
    border: 2px solid #e0342f; border-radius: 3px; pointer-events: none;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: .12; } }
  .pageno {
    position: absolute; right: 1.5%; bottom: 1.2%;
    font-size: calc(var(--chf) * .5cqh); color: #8aa0b8; pointer-events: none;
  }
  #ta {
    position: absolute; opacity: 0; padding: 0; border: none; outline: none;
    background: transparent; caret-color: transparent; resize: none;
    overflow: hidden; z-index: 5;
  }
  @media print {
    .toolbar, #ta, .caret { display: none !important; }
    body { background: #fff; }
    #pages { padding: 0; }
    .page { width: 100%; margin: 0; box-shadow: none; page-break-after: always; }
    .page:last-child { page-break-after: auto; }
  }
</style>

/* マス目（グリッド）は用紙ごとの座標データ(PRESETS)から動的に描画する。

function buildGrid(m) {
  var cw = m.cellWfrac * 100, ch = m.cellHfrac * 100;
  var rects = '';
  for (var l = 0; l < m.lineFrac.length; l++) {
    for (var c = 0; c < m.charFrac.length; c++) {
      var xy = cellXY(m, l, c);
      var x = (xy.x * 100 - cw / 2).toFixed(3);
      var y = (xy.y * 100 - ch / 2).toFixed(3);
      rects += '<rect x="' + x + '" y="' + y + '" width="' + cw.toFixed(3) +
               '" height="' + ch.toFixed(3) + '"/>';
    }
  }
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" ' +
            'preserveAspectRatio="none"><g fill="none" stroke="#8aa0b8" ' +
            'stroke-width="0.14">' + rects + '</g></svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

}
function M() { return PRESETS[currentKey()]; }

function kanaOn() { return document.getElementById('optKana').checked; }

/* ひらがな表記の切り替え（data-k=漢字／data-h=ひらがな） */
function applyKana() {
  var on = kanaOn();
  var els = document.querySelectorAll('[data-k]');
  for (var i = 0; i < els.length; i++) {
    els[i].textContent = on ? els[i].getAttribute('data-h') : els[i].getAttribute('data-k');
  }
  try { localStorage.setItem('genko-kana', on ? '1' : ''); } catch (e) {}
  render();
}

ta.value = localStorage.getItem('genko-text') || '';

function opts() {
  return {
    indent: document.getElementById('optIndent').checked,
    kinsoku: document.getElementById('optKinsoku').checked
  };
}

/* ===== レイアウト（行送り・ページ送り）＋caret用の位置表 ===== */
function layout(text, o, m) {
  var LINES = m.lines, CHARS = m.chars;
  var pages = [], page = null, line = null, lastLine = null, li = 0, pos = 0;
  var cellPos = new Array(text.length + 1);
  function newPage() { page = { lines: [] }; pages.push(page); li = 0; }
  function startLine() {
    if (line) lastLine = line;
    if (li >= LINES) newPage();
    line = { chars: [], hang: null };
    page.lines.push(line); li++; pos = 0;
  }
  newPage(); startLine();

  var i = 0;
  while (i < text.length) {
    var cp = text.codePointAt(i);
    var ch = String.fromCodePoint(cp);
    var step = ch.length;
    cellPos[i] = { p: pages.length - 1, l: li - 1, c: pos };
    if (ch === '\r') { i += step; continue; }
    if (ch === '\n') { startLine(); if (o.indent) pos = 1; i += step; continue; }
    if (pos === 0 && o.kinsoku && KINSOKU.indexOf(ch) >= 0 && lastLine && !lastLine.hang) {
      lastLine.hang = ch; i += step; continue;
    }
    line.chars[pos] = ch; pos++;
    if (pos >= CHARS) startLine();
    i += step;
  }
  cellPos[text.length] = { p: pages.length - 1, l: li - 1, c: pos };
  return { pages: pages, cellPos: cellPos, LINES: LINES, CHARS: CHARS };
}

function ordOf(q, L) { return (q.p * L.LINES + q.l) * L.CHARS + q.c; }

/* マス位置：縦書き＝列(右→左)×行(上→下)／横書き＝行(上→下)×列(左→右) */
function cellXY(m, l, c) {
  if (m.dir === 'v') return { x: m.lineFrac[l], y: m.charFrac[c] };
  return { x: m.charFrac[c], y: m.lineFrac[l] };
}

/* ===== 描画 ===== */
function mkCh(m, ch, xPct, yPct) {
  var sp = document.createElement('span');
  var cls = 'ch';
  if (m.dir === 'v') {
    if (PNC.indexOf(ch) >= 0) cls += ' pnc';
    else if (ROT.indexOf(ch) >= 0) cls += ' rot';
    else if (SML.indexOf(ch) >= 0) cls += ' sml';
  } else {
    if (PNC.indexOf(ch) >= 0) cls += ' pncH';
    else if (SML.indexOf(ch) >= 0) cls += ' smlH';
  }
  sp.className = cls;
  sp.style.left = xPct + '%';
  sp.style.top = yPct + '%';
  sp.textContent = ch;
  return sp;
}

function render() {
  var o = opts();
  var m = M();
  state.L = layout(ta.value, o, m);
  wrap.innerHTML = '';
  var pgs = state.L.pages;
  for (var pi = 0; pi < pgs.length; pi++) {
    var div = document.createElement('div');
    div.className = 'page ' + (m.W >= m.H ? 'land' : 'port');
    div.style.aspectRatio = m.W + ' / ' + m.H;
    div.style.backgroundImage = 'url("' + buildGrid(m) + '")';
    div.style.setProperty('--chf', (m.cellHfrac * 100 * 0.74).toFixed(3));
    div.dataset.p = pi;
    var lines = pgs[pi].lines;
    for (var l = 0; l < lines.length && l < m.lineFrac.length; l++) {
      var cs = lines[l].chars;
      for (var c = 0; c < cs.length && c < m.charFrac.length; c++) {
        if (cs[c] == null) continue;
        var q = cellXY(m, l, c);
        div.appendChild(mkCh(m, cs[c], q.x * 100, q.y * 100));
      }
      if (lines[l].hang) {
        var qe = cellXY(m, l, m.charFrac.length - 1);
        var hx = qe.x * 100, hy = qe.y * 100;
        if (m.dir === 'v') hy += m.cellHfrac * 55; else hx += m.cellWfrac * 55;
        div.appendChild(mkCh(m, lines[l].hang, hx, hy));
      }
    }
    if (pgs.length > 1) {
      var pn = document.createElement('div');
      pn.className = 'pageno';
      pn.textContent = (pi + 1) + ' / ' + pgs.length;
      div.appendChild(pn);
    }
    wrap.appendChild(div);
  }
  // 空白（半角/全角スペース・タブ）と改行はカウントしない
  var chars = Array.from(ta.value.replace(/[\s　]/g, '')).length;
  var kn = kanaOn();
  document.getElementById('count').textContent =
    chars + (kn ? 'じ／' : '字／') + pgs.length + (kn ? 'まい' : '枚');
  try { localStorage.setItem('genko-text', ta.value); } catch (e) {}
  updateCaret();
}

/* ===== カーソル表示と IME 位置 ===== */
function caretPos() {
  var i = (ta.selectionStart != null) ? ta.selectionStart : ta.value.length;
  var q = state.L.cellPos[i];
  while (!q && i > 0) { i--; q = state.L.cellPos[i]; }
  return q || { p: 0, l: 0, c: 0 };
}

function updateCaret() {
  var old = document.querySelector('.caret');
  if (old) old.remove();
  if (!state.L) return;
  var m = M();
  var q = caretPos();
  var pageEl = wrap.children[q.p];
  if (!pageEl) return;
  var l = Math.min(q.l, m.lineFrac.length - 1), c = Math.min(q.c, m.charFrac.length - 1);
  var xy = cellXY(m, l, c);
  var el = document.createElement('div');
  el.className = 'caret';
  el.style.left = (xy.x * 100) + '%';
  el.style.top = (xy.y * 100) + '%';
  el.style.width = (m.cellWfrac * 100) + '%';
  el.style.height = (m.cellHfrac * 100) + '%';
  pageEl.appendChild(el);
  placeTa(pageEl, xy);
}

function placeTa(pageEl, xy) {
  var m = M();
  var rect = pageEl.getBoundingClientRect();
  var cellW = rect.width * m.cellWfrac, cellH = rect.height * m.cellHfrac;
  ta.style.left = (window.scrollX + rect.left + xy.x * rect.width - cellW / 2) + 'px';
  ta.style.top = (window.scrollY + rect.top + xy.y * rect.height - cellH / 2) + 'px';
  ta.style.width = Math.max(20, cellW) + 'px';
  ta.style.height = Math.max(20, cellH) + 'px';
  ta.style.fontSize = (cellH * 0.8) + 'px';
}

/* ===== マスをクリック → その位置にカーソル ===== */
wrap.addEventListener('mousedown', function (ev) {
  var pageEl = ev.target.closest('.page');
  if (!pageEl) return;
  ev.preventDefault();
  var m = M();
  var rect = pageEl.getBoundingClientRect();
  var fx = (ev.clientX - rect.left) / rect.width;
  var fy = (ev.clientY - rect.top) / rect.height;
  function nearest(arr, v) {
    var bi = 0, bd = 9e9;
    for (var i = 0; i < arr.length; i++) {
      var d = Math.abs(arr[i] - v);
      if (d < bd) { bd = d; bi = i; }
    }
    return bi;
  }
  var l, c;
  if (m.dir === 'v') { l = nearest(m.lineFrac, fx); c = nearest(m.charFrac, fy); }
  else { l = nearest(m.lineFrac, fy); c = nearest(m.charFrac, fx); }
  var p = parseInt(pageEl.dataset.p, 10) || 0;
  var L = state.L;
  var ord0 = (p * L.LINES + l) * L.CHARS + c;
  var cp = L.cellPos, si = ta.value.length;
  for (var i = 0; i <= ta.value.length; i++) {
    if (cp[i] && ordOf(cp[i], L) >= ord0) { si = i; break; }
  }
  ta.focus({ preventScroll: true });
  ta.setSelectionRange(si, si);
  updateCaret();
});

/* ===== イベント ===== */
ta.addEventListener('input', render);
document.addEventListener('selectionchange', function () {
  if (document.activeElement === ta) updateCaret();
});
window.addEventListener('resize', updateCaret);

document.body.addEventListener('keydown', function (ev) {
  var t = ev.target;
  if (t !== ta && t.tagName !== 'INPUT' && t.tagName !== 'SELECT' && t.tagName !== 'BUTTON') {
    ta.focus({ preventScroll: true });
  }
});

function saveSettings() {
  try {
    localStorage.setItem('genko-paper', paper);
    localStorage.setItem('genko-dir', dir);
  } catch (e) {}
}

document.getElementById('optKana').checked = (localStorage.getItem('genko-kana') === '1');
document.getElementById('optKana').addEventListener('change', applyKana);

document.getElementById('selPaper').value = paper;
document.getElementById('selDir').value = dir;

document.getElementById('selPaper').addEventListener('change', function () {
  paper = this.value; saveSettings(); setPrintSize(); render();
});
document.getElementById('selDir').addEventListener('change', function () {
  dir = this.value; saveSettings(); setPrintSize(); render();
});
document.getElementById('optIndent').addEventListener('change', render);
document.getElementById('optKinsoku').addEventListener('change', render);

/* ===== 保存（.txtダウンロード）と読み込み（アップロード） ===== */
function pad2(n) { return (n < 10 ? '0' : '') + n; }

document.getElementById('saveBtn').addEventListener('click', function () {
  if (!ta.value.trim()) { alert('本文がまだ空です。'); return; }
  var d = new Date();
  var name = '原稿用紙_' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) +
             '_' + pad2(d.getHours()) + pad2(d.getMinutes()) + '.txt';
  var blob = new Blob(['﻿' + ta.value], { type: 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
});

document.getElementById('openBtn').addEventListener('click', function () {
  document.getElementById('fileIn').click();
});

document.getElementById('fileIn').addEventListener('change', function () {
  var f = this.files && this.files[0];
  this.value = '';
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    var t = String(rd.result).replace(/^﻿/, '').replace(/\r\n?/g, '\n');
    if (ta.value.trim() &&
        !confirm('今の本文を、読み込んだファイルの内容で置き換えます。よろしいですか？')) return;
    ta.value = t;
    render();
    ta.focus({ preventScroll: true });
  };
  rd.onerror = function () { alert('ファイルを読み込めませんでした。'); };
  rd.readAsText(f, 'UTF-8');
});

/* ===== 印刷・PDF（別ウィンドウ方式：iframe/GAS埋め込みでも動く） ===== */
function pageMM() {
  var m = M();
  var mm = PAPER_MM[paper];                       // [短辺, 長辺]
  return (m.W >= m.H) ? [mm[1], mm[0]] : [mm[0], mm[1]];  // 実プリセットの向きに合わせる
}

function doPrint(mode) {
  if (!ta.value.trim()) { alert('本文がまだ空です。'); return; }
  var m = M();
  var caret = document.querySelector('.caret'); if (caret) caret.remove();
  var container = wrap.cloneNode(true);
  var pgs = container.querySelectorAll('.page');
  for (var i = 0; i < pgs.length; i++) {
    pgs[i].style.backgroundImage = 'none';
    if (mode === 'grid') {
      var im = document.createElement('img');
      im.src = buildGrid(m);
      im.className = 'gridimg';
      pgs[i].insertBefore(im, pgs[i].firstChild);
    }
  }
  var mm = pageMM();
  var css = [
    '@page { size: ' + mm[0] + 'mm ' + mm[1] + 'mm; margin: 0; }',
    '* { box-sizing: border-box; }',
    'html,body { margin: 0; padding: 0; }',
    '.page { position: relative; width: ' + mm[0] + 'mm; aspect-ratio: ' + m.W + ' / ' + m.H + ';',
    '  container-type: size; page-break-after: always; }',
    '.page:last-child { page-break-after: auto; }',
    '.gridimg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 0; }',
    '.ch { position: absolute; z-index: 1; transform: translate(-50%,-50%); line-height: 1; white-space: pre;',
    '  color: #111; font-size: calc(var(--chf) * 1cqh);',
    '  font-family: "UD デジタル 教科書体 N-R","UD Digi Kyokasho N-R","Klee One","Yu Mincho","YuMincho","Hiragino Mincho ProN",serif; }',
    '.ch.pnc { transform: translate(-50%,-50%) translate(32%,-32%); }',
    '.ch.rot { transform: translate(-50%,-50%) rotate(90deg); }',
    '.ch.sml { transform: translate(-50%,-50%) translate(16%,-16%); }',
    '.ch.pncH { transform: translate(-50%,-50%) translate(-32%,32%); }',
    '.ch.smlH { transform: translate(-50%,-50%) translate(-16%,16%); }',
    '.pageno { position: absolute; z-index: 1; right: 1.5%; bottom: 1.2%;',
    '  font-size: calc(var(--chf) * .5cqh); color: #8aa0b8; }'
  ].join('\n');
  var win = window.open('', '_blank');
  if (!win) { alert('印刷ウィンドウを開けませんでした。ブラウザのポップアップを許可してください。'); updateCaret(); return; }
  win.document.open();
  win.document.write(
    '<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">' +
    '<title>原稿用紙 印刷</title><style>' + css + '</style></head><body>' +
    container.innerHTML + '</body></html>');
  win.document.close();
  var fired = false;
  function go() { if (fired) return; fired = true; try { win.focus(); win.print(); } catch (e) {} }
  win.onload = go;
  setTimeout(go, 600);
  updateCaret();
}
document.getElementById('printBtn').addEventListener('click', function () { doPrint('text'); });
document.getElementById('printBtn2').addEventListener('click', function () { doPrint('grid'); });

function setPrintSize() {
  var mm = pageMM();
  document.getElementById('pstyle').textContent =
    '@page { size: ' + mm[0] + 'mm ' + mm[1] + 'mm; margin: 0; }';
}

setPrintSize();
applyKana();   // 表記（漢字/ひらがな）を初期状態に合わせて反映（内部でrenderも実行）
ta.focus({ preventScroll: true });
</script>
</body>
</html>
